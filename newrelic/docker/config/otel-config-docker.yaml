extensions:
  health_check:
    endpoint: ${env:OTEL_COLLECTOR_HOST}:13133

receivers:
  docker_stats:
    endpoint: unix:///var/run/docker.sock
  host_metrics:
    collection_interval: 30s
    root_path: /hostfs
    scrapers:
      cpu: null
      disk: null
      filesystem:
        exclude_fs_types:
          fs_types:
          - autofs
          - binfmt_misc
          - bpf
          - cgroup2
          - configfs
          - debugfs
          - devpts
          - devtmpfs
          - fusectl
          - hugetlbfs
          - iso9660
          - mqueue
          - nsfs
          - overlay
          - proc
          - procfs
          - pstore
          - rpc_pipefs
          - securityfs
          - selinuxfs
          - squashfs
          - sysfs
          - tracefs
          match_type: strict
        exclude_mount_points:
          match_type: regexp
          mount_points:
          - /dev/*
          - /proc/*
          - /sys/*
          - /run/k3s/containerd/*
          - /var/lib/docker/*
          - /var/lib/kubelet/*
          - /snap/*
      load: null
      memory: null
      network: null
  http_check/frontend-proxy:
    targets:
    - endpoint: http://frontend-proxy:8080
  # Kafka broker metrics, including kafka.consumer_group.lag for the
  # kafkaQueueProblems scenario.
  kafka_metrics:
    brokers:
    - ${env:KAFKA_ADDR}
    protocol_version: 2.0.0
    # cluster_alias should emit the kafka.cluster.alias resource attribute, but this
    # image's contrib version never emits it (see transform/kafka_cluster_name below).
    # Kept as future-proofing for when the fix lands upstream.
    cluster_alias: otel-demo-kafka
    scrapers:
    - brokers
    - topics
    - consumers
    collection_interval: 15s
  otlp:
    protocols:
      grpc:
        endpoint: ${env:OTEL_COLLECTOR_HOST}:4317
      http:
        cors:
          allowed_origins:
          - http://*
          - https://*
        endpoint: ${env:OTEL_COLLECTOR_HOST}:4318
  prometheus:
    config:
      scrape_configs:
      - job_name: opentelemetry-collector
        scrape_interval: 30s
        static_configs:
        - targets:
          - ${env:OTEL_COLLECTOR_HOST}:8888
  # Demo: scrape a Prometheus /metrics endpoint exposed by the ad service
  # using the Prometheus Java client library, bridging existing
  # Prometheus-client instrumentation into the OTel pipeline.
  prometheus/ad:
    config:
      scrape_configs:
      - job_name: ad
        scrape_interval: 10s
        static_configs:
        - targets:
          - ad:${env:AD_PROMETHEUS_PORT}
  redis:
    collection_interval: 30s
    endpoint: valkey-cart:6379

processors:
  batch: {}
  cumulative_to_delta: {}
  gen_ai_normalizer:
    sources:
    - name: openllmetry
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25
  resource:
    attributes:
    - action: insert
      # Setting to host.name for now.
      from_attribute: host.name
      key: service.instance.id
  resource_detection/env:
    detectors:
    - env
    - system
    override: false
    system:
      hostname_sources:
      - os
      resource_attributes:
        host.id:
          enabled: true
  transform:
    error_mode: ignore
    log_statements:
    - context: log
      statements:
      - truncate_all(attributes, 4095)
      - truncate_all(resource.attributes, 4095)
    trace_statements:
    - context: span
      statements:
      - truncate_all(attributes, 4095)
      - truncate_all(resource.attributes, 4095)
  # Sets kafka.cluster.name as a datapoint attribute on Kafka metrics only, since a
  # resource attribute would leak onto sibling non-Kafka metrics sharing the resource.
  #
  # Not using the receiver's cluster_alias option because the baked contrib version
  # never emits it — see https://github.com/open-telemetry/opentelemetry-collector-contrib/pull/47605.
  # TODO: once that lands, copy resource.attributes["kafka.cluster.alias"] instead.
  transform/kafka_cluster_name:
    error_mode: ignore
    metric_statements:
    - context: datapoint
      conditions:
      - IsMatch(metric.name, "^kafka\\.")
      statements:
      - set(attributes["kafka.cluster.name"], "otel-demo-kafka")

exporters:
  debug: {}
  otlp_http/newrelic:
    endpoint: https://otlp.nr-data.net:4318
    headers:
      api-key: ${env:NEW_RELIC_LICENSE_KEY}

service:
  extensions:
  - health_check
  pipelines:
    logs:
      exporters:
      - otlp_http/newrelic
      - debug
      processors:
      - memory_limiter
      - resource
      - transform
      - batch
      receivers:
      - otlp
    metrics:
      exporters:
      - otlp_http/newrelic
      - debug
      processors:
      - memory_limiter
      - resource
      - resource_detection/env
      - transform/kafka_cluster_name
      - cumulative_to_delta
      - batch
      receivers:
      - host_metrics
      - docker_stats
      - kafka_metrics
      - redis
      - otlp
      - prometheus/ad
    traces:
      exporters:
      - otlp_http/newrelic
      - debug
      processors:
      - memory_limiter
      - resource
      - resource_detection/env
      - transform
      - gen_ai_normalizer
      - batch
      receivers:
      - otlp
  telemetry:
    metrics:
      level: basic
      readers:
      - periodic:
          exporter:
            otlp:
              endpoint: http://${env:OTEL_COLLECTOR_HOST}:${env:OTEL_COLLECTOR_PORT_HTTP}
              protocol: http/protobuf
          interval: 30000
          timeout: 5000
