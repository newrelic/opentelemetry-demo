extensions:
  health_check:
    endpoint: ${env:OTEL_COLLECTOR_HOST}:13133

receivers:
  docker_stats:
    endpoint: unix:///var/run/docker.sock
  hostmetrics:
    collection_interval: 30s
    root_path: /hostfs
    scrapers:
      cpu: null
      disk: null
      filesystem:
        exclude_fs_types:
          fs_types:
          - autofs
          - binfmt_misc
          - bpf
          - cgroup2
          - configfs
          - debugfs
          - devpts
          - devtmpfs
          - fusectl
          - hugetlbfs
          - iso9660
          - mqueue
          - nsfs
          - overlay
          - proc
          - procfs
          - pstore
          - rpc_pipefs
          - securityfs
          - selinuxfs
          - squashfs
          - sysfs
          - tracefs
          match_type: strict
        exclude_mount_points:
          match_type: regexp
          mount_points:
          - /dev/*
          - /proc/*
          - /sys/*
          - /run/k3s/containerd/*
          - /var/lib/docker/*
          - /var/lib/kubelet/*
          - /snap/*
      load: null
      memory: null
      network: null
  httpcheck/frontend-proxy:
    targets:
    - endpoint: http://frontend-proxy:8080
  # Kafka broker metrics, including kafka.consumer_group.lag for the
  # kafkaQueueProblems scenario.
  kafkametrics:
    brokers:
    - ${env:KAFKA_ADDR}
    protocol_version: 2.0.0
    # cluster_alias should emit the kafka.cluster.alias resource attribute, but this
    # image's contrib version never emits it (see transform/kafka_cluster_name below).
    # Kept as future-proofing for when the fix lands upstream.
    cluster_alias: otel-demo-kafka
    scrapers:
    - brokers
    - topics
    - consumers
    collection_interval: 15s
  otlp:
    protocols:
      grpc:
        endpoint: ${env:OTEL_COLLECTOR_HOST}:4317
      http:
        cors:
          allowed_origins:
          - http://*
          - https://*
        endpoint: ${env:OTEL_COLLECTOR_HOST}:4318
  prometheus:
    config:
      scrape_configs:
      - job_name: opentelemetry-collector
        scrape_interval: 30s
        static_configs:
        - targets:
          - ${env:OTEL_COLLECTOR_HOST}:8888
  # Demo: scrape a Prometheus /metrics endpoint exposed by the ad service
  # using the Prometheus Java client library, bridging existing
  # Prometheus-client instrumentation into the OTel pipeline.
  prometheus/ad:
    config:
      scrape_configs:
      - job_name: ad
        scrape_interval: 10s
        static_configs:
        - targets:
          - ad:${env:AD_PROMETHEUS_PORT}
  redis:
    collection_interval: 30s
    endpoint: valkey-cart:6379

processors:
  batch: {}
  cumulativetodelta: {}
  gen_ai_normalizer:
    sources:
    - name: openllmetry
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25
  resource:
    attributes:
    - action: insert
      # Setting to host.name for now.
      from_attribute: host.name
      key: service.instance.id
  resourcedetection/env:
    detectors:
    - env
    - system
    override: false
    system:
      hostname_sources:
      - os
      resource_attributes:
        host.id:
          enabled: true
  transform:
    error_mode: ignore
    log_statements:
    - context: log
      statements:
      - truncate_all(attributes, 4095)
      - truncate_all(resource.attributes, 4095)
    trace_statements:
    - context: span
      statements:
      - truncate_all(attributes, 4095)
      - truncate_all(resource.attributes, 4095)
    - context: span
      statements:
      - replace_pattern(name, "\\?.*", "")
      - replace_match(name, "GET /api/products/*", "GET /api/products/{productId}")
  # Rewrites the messages emitted by flagd failure scenarios into what a real incident would
  # look like. Best effort: error_mode ignore and per-group conditions mean unmatched or
  # failing statements leave the telemetry untouched.
  transform/flag_scenarios:
    error_mode: ignore
    log_statements:
    - context: log
      conditions:
      - 'resource.attributes["service.name"] == "ad" and IsMatch(body.string, "adManualGc")'
      statements:
      - 'set(body, "[gc] Pause Full (System.gc()) 1843M->412M(2048M) 1312.447ms")'
    - context: log
      conditions:
      - 'resource.attributes["service.name"] == "ad" and IsMatch(body.string, "High CPU-Load problempattern")'
      statements:
      - 'set(body, "Request processing time exceeded threshold: thread pool saturated, active=200 queued=1312 cpu=98%")'
    - context: log
      conditions:
      - 'resource.attributes["service.name"] == "checkout" and IsMatch(body.string, "kafkaQueueProblems")'
      statements:
      - 'set(body, "kafka: producer queue full: local queue saturated, delivery to topic \"orders\" delayed (queue.buffering.max.messages reached)")'
    - context: log
      conditions:
      - 'resource.attributes["service.name"] == "fraud-detection" and IsMatch(body.string, "kafkaQueueProblems")'
      statements:
      - 'set(body, "Consumer group \"frauddetection\" lag increasing on topic \"orders\": poll() loop exceeded expected interval, processing 1000ms per record")'
    - context: log
      conditions:
      - 'resource.attributes["service.name"] == "product-catalog" and IsMatch(body.string, "^lock contention scenario active")'
      statements:
      - 'set(body, "pq: canceling statement due to lock timeout: relation \"catalog.products\" is locked in ACCESS EXCLUSIVE mode by another transaction")'
    - context: log
      conditions:
      - 'resource.attributes["service.name"] == "shipping" and IsMatch(body.string, "intlShippingSlowdown")'
      statements:
      - 'set(body, "Carrier rate API timeout for international shipment, falling back to slow path")'
    trace_statements:
    - context: span
      conditions:
      - 'resource.attributes["service.name"] == "product-catalog" and IsMatch(status.message, "Product Catalog Fail Feature Flag Enabled")'
      statements:
      - 'set(status.message, "rpc error: code = Internal desc = failed to query product: pq: could not read block in file \"base/16384/24576\": Input/output error")'
    - context: spanevent
      conditions:
      - 'resource.attributes["service.name"] == "product-catalog" and IsMatch(name, "Product Catalog Fail Feature Flag Enabled")'
      statements:
      - 'set(name, "rpc error: code = Internal desc = failed to query product: pq: could not read block in file \"base/16384/24576\": Input/output error")'
  # Sets kafka.cluster.name as a datapoint attribute on Kafka metrics only, since a
  # resource attribute would leak onto sibling non-Kafka metrics sharing the resource.
  #
  # Not using the receiver's cluster_alias option because the baked contrib version
  # never emits it — see https://github.com/open-telemetry/opentelemetry-collector-contrib/pull/47605.
  # TODO: once that lands, copy resource.attributes["kafka.cluster.alias"] instead.
  transform/kafka_cluster_name:
    error_mode: ignore
    metric_statements:
    - context: datapoint
      conditions:
      - IsMatch(metric.name, "^kafka\\.")
      statements:
      - set(attributes["kafka.cluster.name"], "otel-demo-kafka")

exporters:
  debug: {}
  otlphttp/newrelic:
    endpoint: https://otlp.nr-data.net:4318
    headers:
      api-key: ${env:NEW_RELIC_LICENSE_KEY}

service:
  extensions:
  - health_check
  pipelines:
    logs:
      exporters:
      - otlphttp/newrelic
      - debug
      processors:
      - memory_limiter
      - resource
      - transform
      - transform/flag_scenarios
      - batch
      receivers:
      - otlp
    metrics:
      exporters:
      - otlphttp/newrelic
      - debug
      processors:
      - memory_limiter
      - resource
      - resourcedetection/env
      - transform/kafka_cluster_name
      - cumulativetodelta
      - batch
      receivers:
      - hostmetrics
      - docker_stats
      - kafkametrics
      - redis
      - otlp
      - prometheus/ad
    traces:
      exporters:
      - otlphttp/newrelic
      - debug
      processors:
      - memory_limiter
      - resource
      - resourcedetection/env
      - transform
      - transform/flag_scenarios
      - gen_ai_normalizer
      - batch
      receivers:
      - otlp
  telemetry:
    metrics:
      level: basic
      readers:
      - periodic:
          exporter:
            otlp:
              endpoint: ${env:OTEL_COLLECTOR_HOST}:${env:OTEL_COLLECTOR_PORT_HTTP}
              protocol: http/protobuf
          interval: 30000
          timeout: 5000
