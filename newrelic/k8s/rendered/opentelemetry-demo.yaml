          \"priceUsd\": {\"currencyCode\": \"USD\", \"units\": 129, \"nanos\": 950000000},
          \"categories\": [\"telescopes\", \"travel\"]}, {\"id\": \"2ZYFJ3GM2N\", \"name\":
          \"Roof Binoculars\", \"description\": \"This versatile, all-around binocular
