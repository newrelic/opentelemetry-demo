              value: "4318"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.name=$(OTEL_SERVICE_NAME), service.namespace=opentelemetry-demo,
                service.version=3.0.0, service.instance.id=$(OTEL_POD_NAME),
                k8s.container.name=$(OTEL_K8S_CONTAINER_NAME), k8s.pod.name=$(OTEL_POD_NAME),
                k8s.pod.uid=$(OTEL_POD_UID), k8s.namespace.name=$(OTEL_NAMESPACE_NAME), k8s.cluster.name=$(OTEL_CLUSTER_NAME),service.criticality=critical
          resources:
            limits:
              memory: 90Mi
          securityContext:
            runAsGroup: 101
            runAsNonRoot: true
            runAsUser: 101
          volumeMounts:
            - mountPath: /home/envoy/envoy.tmpl.yaml
              name: patched-envoy-config
              subPath: envoy.tmpl.yaml
      initContainers:
        - command:
          - sh
          - -c
          - cp /home/envoy/envoy.tmpl.yaml /patched/envoy.tmpl.yaml
          image: ghcr.io/open-telemetry/demo:3.0.0-frontend-proxy
          name: copy-envoy-config
          volumeMounts:
          - mountPath: /patched
            name: patched-envoy-config
        - command:
          - python
          - -c
          - |
            with open('/patched/envoy.tmpl.yaml', 'r') as f:
                content = f.read()
        
            # Insert the slowLcp fault-injection route right before the
            # catch-all route, so unmatched /product/ traffic (no query
            # param) keeps falling through to the catch-all exactly as
            # before.
            #
            # No textwrap.dedent() here - the YAML block scalar above already
            # strips this block's own outer nesting indentation before Python
            # ever sees it, so these strings already carry the envoy file's
            # real absolute indentation (24/26 spaces). Dedenting again would
            # strip that too, and the exact-text match below would never hit.
            orig_route = ("""\
                                    - match: { prefix: "/" }  # Default/catch-all route - keep last since prefix:"/" matches everything
                                      route: { cluster: frontend }""")
        
            new_route = ("""\
                                    # EXPERIMENTAL: server-side-only LCP degradation for
                                    # testing - matched only when the client adds
                                    # ?slowLcp=<ms>, so normal /product/ traffic (no query
                                    # param) falls through to the catch-all route below
                                    # exactly as before.
                                    - match:
                                        prefix: "/product/"
                                        query_parameters:
                                          - name: slowLcp
                                            present_match: true
                                      typed_per_filter_config:
                                        envoy.filters.http.fault:
                                          "@type": type.googleapis.com/envoy.extensions.filters.http.fault.v3.HTTPFault
                                          delay:
                                            fixed_delay: 10s
                                            percentage:
                                              numerator: 100
                                      route: { cluster: frontend }
                                    - match: { prefix: "/" }  # Default/catch-all route - keep last since prefix:"/" matches everything
                                      route: { cluster: frontend }""")
        
            assert orig_route in content, 'catch-all route text not found - upstream envoy.tmpl.yaml changed'
        
            content = content.replace(orig_route, new_route)
        
            with open('/patched/envoy.tmpl.yaml', 'w') as f:
                f.write(content)
          image: docker.io/library/python:3.12-slim
          name: patch-envoy-config
          volumeMounts:
          - mountPath: /patched
            name: patched-envoy-config
      volumes:
        - emptyDir: {}
          name: patched-envoy-config
