apiVersion: apps/v1
kind: Deployment
metadata:
  name: astronomy-db
  labels:
    helm.sh/chart: opentelemetry-demo-0.41.2
    
    opentelemetry.io/name: astronomy-db
    
    app.kubernetes.io/version: "3.0.0"
    app.kubernetes.io/component: astronomy-db
    app.kubernetes.io/name: astronomy-db
    app.kubernetes.io/part-of: opentelemetry-demo
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      
      opentelemetry.io/name: astronomy-db
  template:
    metadata:
      labels:
        
        opentelemetry.io/name: astronomy-db
        
        app.kubernetes.io/version: "3.0.0"
        app.kubernetes.io/component: astronomy-db
        app.kubernetes.io/name: astronomy-db
      annotations:
        io.opentelemetry.discovery.metrics/config: |
          username: monitoring_user
          password: monitoring_password
          metrics:
            postgresql.blks_hit:
              enabled: true
            postgresql.blks_read:
              enabled: true
            postgresql.tup_fetched:
              enabled: true
            postgresql.tup_returned:
              enabled: true
            postgresql.tup_inserted:
              enabled: true
            postgresql.tup_updated:
              enabled: true
            postgresql.tup_deleted:
              enabled: true
            postgresql.deadlocks:
              enabled: true
          tls:
            insecure: true
        io.opentelemetry.discovery.metrics/enabled: "true"
        io.opentelemetry.discovery.metrics/scraper: postgresql
        resource.opentelemetry.io/service.namespace: opentelemetry-demo
    spec:
      serviceAccountName: otel-demo
      containers:
        - name: astronomy-db
          image: 'postgres:18.4'
          imagePullPolicy: IfNotPresent
          command:
            - docker-entrypoint.sh
            - postgres
            - -c
            - shared_preload_libraries=pg_stat_statements
            - -c
            - pg_stat_statements.track=all
            - -c
            - pg_stat_statements.max=10000
            - -c
            - pg_stat_statements.save=on
            - -c
