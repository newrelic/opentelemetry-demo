cluster: "opentelemetry-demo"
customSecretName: "newrelic-license-key"
customSecretLicenseKey: "license-key"

# NRDOT K8s OTel Collector image does not ship with the spanmetrics connector. Using contrib instead.
# Will remove if/when spanmetrics is added to NRDOT.
images:
  collector:
    registry: ""
    repository: otel/opentelemetry-collector-contrib
    tag: "0.157.0"
    pullPolicy: IfNotPresent

# This configuration adds pipeline support for the OpenTelemetry Demo application telemetry.
# By adding this, we can disable the OTel Collector shipped as part of the OpenTelemetry Demo application,
# and rely solely on the NRDOT K8s OTel Collector instances.
deployment:
  configMap:
    extraConfig:
      receivers:
        # Demo: scrape a Prometheus /metrics endpoint exposed by the ad
        # service using the Prometheus Java client library, bridging
        # existing Prometheus-client instrumentation into the OTel pipeline.
        prometheus/ad:
          config:
            scrape_configs:
              - job_name: ad
                scrape_interval: 10s
                static_configs:
                  - targets: ["ad:9465"]

      connectors:
        spanmetrics:
          metrics_flush_interval: 30s
          aggregation_temporality: AGGREGATION_TEMPORALITY_DELTA
          dimensions:
            - name: http.method
            - name: http.request.method
            - name: http.route
            - name: http.status_code
            - name: http.response.status_code
            - name: rpc.system
            - name: rpc.service
            - name: rpc.method
            - name: rpc.response.status_code
            - name: rpc.status_code
            - name: db.system
            - name: db.operation
            - name: db.sql.table
            - name: db.system.name
            - name: error.type
            - name: server.address
            - name: net.peer.name
          exclude_dimensions:
            - span.name
            - status.code
          resource_metrics_key_attributes:
            - service.name
            - telemetry.sdk.language
            - telemetry.sdk.name

      exporters:
        debug: {}

      processors:
        # Strip description/unit from all metrics scraped from the ad
        # service's Prometheus endpoint, mirroring NRDOT's own
        # transform/low_data_mode_inator approach for its bundled metrics.
        # Scoped by the ad job's resource attribute (set by the prometheus
        # receiver from the scrape job name) rather than a specific metric
        # name, so it covers whatever ad exposes, not just today's counter.
        transform/strip_ad_metric_metadata:
          metric_statements:
            - context: metric
              conditions:
                - resource.attributes["service.name"] == "ad"
              statements:
                - set(metric.description, "")
                - set(metric.unit, "")

        # Drop Python system metrics since they're duplicates of hostmetrics
        # https://opentelemetry-python-contrib.readthedocs.io/en/latest/instrumentation/system_metrics/system_metrics.html
        filter/python-system-metrics:
          error_mode: ignore
          metrics:
            metric:
              - 'instrumentation_scope.name == "opentelemetry.instrumentation.system_metrics"'

        # Drop spanmetrics metrics for services that DO publish metrics by default
        filter/drop-spanmetrics-services:
          metrics:
            datapoint:
              - metric.name == "traces.span.metrics.calls" and not IsMatch(resource.attributes["service.name"], "(currency|quote|payment|product-reviews|recommendation)")
              - metric.name == "traces.span.metrics.duration" and not IsMatch(resource.attributes["service.name"], "(currency|quote|payment|product-reviews|recommendation)")

        # Required to enable spanmetrics in the New Relic summary UI
        resource/newrelic_spanmetrics_flag:
          attributes:
            - action: upsert
              key: newrelic.spanmetrics.enabled
              value: true

        resourcedetection/otel-demo:
          detectors: [env]

        # Converts Traceloop/OpenLLMetry telemetry from agent/mcp/chatbot into
        # official gen_ai.* semconv attributes.
        gen_ai_normalizer:
          sources:
            - name: openllmetry

        # This processor is used to help limit high cardinality on next.js span names
        # When this PR is merged (and released) we can remove this transform processor
        # https://github.com/vercel/next.js/pull/64852
        transform/otel-demo:
          error_mode: ignore
          trace_statements:
            # Sanitize spans to prevent span metrics cardinality explosion
            # caused by non-compliant high cardinality span names:
            # 1. Define missing http.route on key HTTP operations for meaningful operation names
            # 2. Then normalize span names; http server spans lacking http.route default to operations "GET", "POST", etc.
            - context: span
              # FRONTEND SERVICE
              conditions:
                - span.kind == SPAN_KIND_SERVER and resource.attributes["service.name"] == "frontend" and span.attributes["http.route"] == nil
              statements:
                # Workaround for Next.js high cardinality span name issue: https://github.com/vercel/next.js/issues/54694
                - set(span.attributes["http.route"], "/api/cart") where IsMatch(span.attributes["http.target"], "\\/api\\/cart")  # e.g. # /api/cart
                - set(span.attributes["http.route"], "/api/checkout") where IsMatch(span.attributes["http.target"], "\\/api\\/checkout")  # e.g. # /api/checkout
                - set(span.attributes["http.route"], "/api/products/{productId}") where IsMatch(span.attributes["http.target"], "\\/api\\/products\\/.*")  # e.g. /api/products/1YMWWN1N4O
                - set(span.attributes["http.route"], "/api/recommendations") where IsMatch(span.attributes["http.target"], "\\/api\\/recommendations")  # e.g. # /api/recommendations?productIds=...
                # e.g. "/api/data?contextKeys=telescopes" or /api/data/?contextKeys=cameras
                - set(span.attributes["http.route"], "/api/data") where IsMatch(span.attributes["http.target"], "\\/api\\/data.*")

        resource/otel-demo:
          attributes:
            - key: service.instance.id
              from_attribute: k8s.pod.uid
              action: insert

        # otelgrpc never sets error.type on rpc.server.call.duration /
        # rpc.client.call.duration even when the RPC failed, so NR's
        # error.type-based error-rate rule can't match gRPC traffic. This is
        # gRPC not following semconv, not a New Relic gap:
        # https://github.com/open-telemetry/opentelemetry-go-contrib/issues/9426
        # Backfill a coarse error.type from the status code NR does receive
        # so error rate shows up; remove once otelgrpc sets error.type itself.
        transform/grpc_error_type:
          error_mode: ignore
          metric_statements:
            - context: datapoint
              # Multiple entries under conditions: are OR'd together, not
              # AND'd - two separate list items here would match every
              # rpc.server.call.duration/rpc.client.call.duration datapoint
              # on the metric-name check alone, tagging error.type=SERVER
              # ERROR on successful calls too. Both checks must be one
              # condition string joined with "and".
              conditions:
                - >-
                  (metric.name == "rpc.server.call.duration" or metric.name
                  == "rpc.client.call.duration") and
                  attributes["rpc.response.status_code"] != nil and
                  attributes["rpc.response.status_code"] != "OK"
              statements:
                - set(attributes["error.type"], "SERVER ERROR")

      pipelines:

        # Spanmetrics are being used to populate the Summary UIs for services that do not publish metrics by default
        metrics/spanmetrics:
          exporters:
            - otlp_http/newrelic
          processors:
            - memory_limiter
            - filter/drop-spanmetrics-services
            - resource/newrelic_spanmetrics_flag
            - batch
          receivers:
            - spanmetrics

        metrics/otel-demo:
          receivers:
            - otlp
            - prometheus/ad
          processors:
            - memory_limiter
            - filter/python-system-metrics
            - resourcedetection/otel-demo
            - resource/otel-demo
            - k8s_attributes/ksm
            - transform/strip_ad_metric_metadata
            - transform/grpc_error_type
            - cumulativetodelta
            - batch
          exporters:
            - otlp_http/newrelic

        traces/otel-demo:
          exporters:
            - spanmetrics
            - otlp_http/newrelic
          processors:
            - memory_limiter
            - resourcedetection/otel-demo
            - resource/otel-demo
            - transform/otel-demo
            - k8s_attributes/ksm
            - gen_ai_normalizer
            - batch
          receivers:
            - otlp

        logs/otel-demo:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - resourcedetection/otel-demo
            - resource/otel-demo
            - transform/otel-demo
            - batch
          exporters:
            - otlp_http/newrelic
