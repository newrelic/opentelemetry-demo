default:
  # List of environment variables applied to all components
  env:
    - name: OTEL_SERVICE_NAME
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: "metadata.labels['app.kubernetes.io/component']"
    - name: OTEL_POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: OTEL_POD_UID
      valueFrom:
        fieldRef:
          fieldPath: metadata.uid
    - name: OTEL_K8S_CONTAINER_NAME
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: "metadata.labels['app.kubernetes.io/component']"
    - name: OTEL_NAMESPACE_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: OTEL_CLUSTER_NAME
      value: opentelemetry-demo
    # Service hosts below are FQDNs: musl (Alpine images) ignores a resolv.conf
    # search line of 256+ bytes, which sandbox host domains can cause.
    - name: OTEL_COLLECTOR_NAME
      value: nr-k8s-otel-collector-gateway.{{ .Release.Namespace }}.svc.cluster.local
    - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
      value: delta
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: >-
        service.name=$(OTEL_SERVICE_NAME),
        service.namespace=opentelemetry-demo,
        service.version={{ .Chart.AppVersion }},
        service.instance.id=$(OTEL_POD_NAME),
        k8s.container.name=$(OTEL_K8S_CONTAINER_NAME),
        k8s.pod.name=$(OTEL_POD_NAME),
        k8s.pod.uid=$(OTEL_POD_UID),
        k8s.namespace.name=$(OTEL_NAMESPACE_NAME),
        k8s.cluster.name=$(OTEL_CLUSTER_NAME)
    - name: OTEL_METRIC_EXPORT_INTERVAL
      value: "10000"
    - name: KAFKA_CLUSTER_NAME
      value: otel-demo-kafka

components:
  accounting:
    resources:
      limits:
        memory: 300Mi
        cpu: 200m
      requests:
        memory: 160Mi
        cpu: 30m
  checkout:
    resources:
      limits:
        memory: 100Mi
        cpu: 300m
      requests:
        memory: 16Mi
        cpu: 14m
  kafka:
    envOverrides:
      - name: KAFKA_NODE_ID
        value: "1"
      - name: KAFKA_ADVERTISED_LISTENERS
        value: PLAINTEXT://kafka.{{ .Release.Namespace }}.svc.cluster.local:9092
      - name: KAFKA_CONTROLLER_QUORUM_VOTERS
        value: 1@kafka.{{ .Release.Namespace }}.svc.cluster.local:9093
      - name: OTEL_RESOURCE_ATTRIBUTES
        value: >-
          service.name=$(OTEL_SERVICE_NAME),
          service.namespace=opentelemetry-demo,
          service.version={{ .Chart.AppVersion }},
          service.instance.id=$(OTEL_POD_NAME),
          k8s.container.name=$(OTEL_K8S_CONTAINER_NAME),
          k8s.pod.name=$(OTEL_POD_NAME),
          k8s.pod.uid=$(OTEL_POD_UID),
          k8s.namespace.name=$(OTEL_NAMESPACE_NAME),
          k8s.cluster.name=$(OTEL_CLUSTER_NAME),
          service.criticality=low,
          kafka.cluster.name=$(KAFKA_CLUSTER_NAME),
          broker.id=$(KAFKA_NODE_ID)
      - name: KAFKA_OPTS
        value: >-
          -javaagent:/tmp/opentelemetry-javaagent.jar
          -XX:+UseG1GC
          -Dotel.jmx.enabled=true
          -Dotel.jmx.config=/etc/kafka/jmx-custom-config.yaml
          -Dotel.instrumentation.runtime-telemetry.enabled=false
    mountedConfigMaps:
      - name: kafka-jmx-custom-config
        mountPath: /etc/kafka/jmx-custom-config.yaml
        subPath: jmx-custom-config.yaml
        data:
          jmx-custom-config.yaml: |
            ---
            rules:
              # ── Per-topic metrics ──────────────────────────────────────────────────────

              - bean: kafka.server:type=BrokerTopicMetrics,name=MessagesInPerSec,topic=*
                metricAttribute:
                  topic: param(topic)
                mapping:
                  Count:
                    metric: kafka.prod.msg.count
                    type: counter
                    desc: The number of messages per topic
                    unit: "{message}"

              - bean: kafka.server:type=BrokerTopicMetrics,name=BytesInPerSec,topic=*
                metricAttribute:
                  topic: param(topic)
                  direction: const(in)
                mapping:
                  Count:
                    metric: kafka.topic.io
                    type: counter
                    desc: The bytes received or sent per topic
                    unit: By

              - bean: kafka.server:type=BrokerTopicMetrics,name=BytesOutPerSec,topic=*
                metricAttribute:
                  topic: param(topic)
                  direction: const(out)
                mapping:
                  Count:
                    metric: kafka.topic.io
                    type: counter
                    desc: The bytes received or sent per topic
                    unit: By

              # ── Cluster-level metrics ──────────────────────────────────────────────────

              - bean: kafka.controller:type=KafkaController,name=GlobalTopicCount
                mapping:
                  Value:
                    metric: kafka.cluster.topic.count
                    type: gauge
                    desc: The total number of global topics in the cluster
                    unit: "{topic}"

              - bean: kafka.controller:type=KafkaController,name=GlobalPartitionCount
                mapping:
                  Value:
                    metric: kafka.cluster.partition.count
                    type: gauge
                    desc: The total number of global partitions in the cluster
                    unit: "{partition}"

              - bean: kafka.controller:type=KafkaController,name=FencedBrokerCount
                mapping:
                  Value:
                    metric: kafka.broker.fenced.count
                    type: gauge
                    desc: The number of fenced brokers in the cluster
                    unit: "{broker}"

              - bean: kafka.controller:type=KafkaController,name=PreferredReplicaImbalanceCount
                mapping:
                  Value:
                    metric: kafka.partition.non_preferred_leader
                    type: gauge
                    desc: The count of topic partitions for which the leader is not the preferred leader
                    unit: "{partition}"

              # ── Broker-level metrics ───────────────────────────────────────────────────

              - bean: kafka.server:type=ReplicaManager,name=UnderMinIsrPartitionCount
                mapping:
                  Value:
                    metric: kafka.partition.under_min_isr
                    type: gauge
                    desc: The number of partitions where the number of in-sync replicas is less than the minimum
                    unit: "{partition}"

              - bean: java.lang:type=Runtime
                mapping:
                  Uptime:
                    metric: kafka.broker.uptime
                    type: gauge
                    desc: Broker uptime in milliseconds
                    unit: ms

              - bean: kafka.server:type=ReplicaManager,name=LeaderCount
                mapping:
                  Value:
                    metric: kafka.broker.leader.count
                    type: gauge
                    desc: Number of partitions for which this broker is the leader
                    unit: "{partition}"

              # ── JVM metrics ───────────────────────────────────────────────────────────

              - bean: java.lang:type=GarbageCollector,name=*
                mapping:
                  CollectionCount:
                    metric: jvm.gc.collections.count
                    type: counter
                    unit: "{collection}"
                    desc: total number of collections that have occurred
                    metricAttribute:
                      name: param(name)

              - bean: java.lang:type=Memory
                unit: By
                prefix: jvm.memory.
                dropNegativeValues: true
                mapping:
                  HeapMemoryUsage.max:
                    metric: heap.max
                    desc: current heap usage
                    type: gauge
                  HeapMemoryUsage.used:
                    metric: heap.used
                    desc: current heap usage
                    type: gauge

              - bean: java.lang:type=Threading
                mapping:
                  ThreadCount:
                    metric: jvm.thread.count
                    type: gauge
                    unit: "{thread}"
                    desc: Total thread count (Kafka typical range 100-300 threads)

              - bean: java.lang:type=OperatingSystem
                prefix: jvm.
                dropNegativeValues: true
                mapping:
                  SystemCpuLoad:
                    metric: system.cpu.utilization
                    type: gauge
                    unit: '1'
                    desc: Recent CPU utilization for whole system (0.0 to 1.0)

              # ── Broker throughput metrics ──────────────────────────────────────────────

              - bean: kafka.server:type=BrokerTopicMetrics,name=MessagesInPerSec
                mapping:
                  Count:
                    metric: kafka.message.count
                    type: counter
                    desc: The number of messages received by the broker
                    unit: "{message}"

              - bean: kafka.server:type=BrokerTopicMetrics,name=TotalFetchRequestsPerSec
                metricAttribute:
                  type: const(fetch)
                mapping:
                  Count:
                    metric: &metric kafka.request.count
                    type: &type counter
                    desc: &desc The number of requests received by the broker
                    unit: &unit "{request}"

              - bean: kafka.server:type=BrokerTopicMetrics,name=TotalProduceRequestsPerSec
                metricAttribute:
                  type: const(produce)
                mapping:
                  Count:
                    metric: *metric
                    type: *type
                    desc: *desc
                    unit: *unit

              - bean: kafka.server:type=BrokerTopicMetrics,name=FailedFetchRequestsPerSec
                metricAttribute:
                  type: const(fetch)
                mapping:
                  Count:
                    metric: &metric kafka.request.failed
                    type: &type counter
                    desc: &desc The number of requests to the broker resulting in a failure
                    unit: &unit "{request}"

              - bean: kafka.server:type=BrokerTopicMetrics,name=FailedProduceRequestsPerSec
                metricAttribute:
                  type: const(produce)
                mapping:
                  Count:
                    metric: *metric
                    type: *type
                    desc: *desc
                    unit: *unit

              - beans:
                  - kafka.network:type=RequestMetrics,name=TotalTimeMs,request=Produce
                  - kafka.network:type=RequestMetrics,name=TotalTimeMs,request=FetchConsumer
                  - kafka.network:type=RequestMetrics,name=TotalTimeMs,request=FetchFollower
                metricAttribute:
                  type: param(request)
                unit: ms
                mapping:
                  99thPercentile:
                    metric: kafka.request.time.99p
                    type: gauge
                    desc: The 99th percentile time the broker has taken to service requests

              - bean: kafka.network:type=RequestChannel,name=RequestQueueSize
                mapping:
                  Value:
                    metric: kafka.request.queue
                    type: gauge
                    desc: Size of the request queue
                    unit: "{request}"

              - bean: kafka.server:type=BrokerTopicMetrics,name=BytesInPerSec
                metricAttribute:
                  direction: const(in)
                mapping:
                  Count:
                    metric: &metric kafka.network.io
                    type: &type counter
                    desc: &desc The bytes received or sent by the broker
                    unit: &unit By

              - bean: kafka.server:type=BrokerTopicMetrics,name=BytesOutPerSec
                metricAttribute:
                  direction: const(out)
                mapping:
                  Count:
                    metric: *metric
                    type: *type
                    desc: *desc
                    unit: *unit

              - beans:
                  - kafka.server:type=DelayedOperationPurgatory,name=PurgatorySize,delayedOperation=Produce
                  - kafka.server:type=DelayedOperationPurgatory,name=PurgatorySize,delayedOperation=Fetch
                metricAttribute:
                  type: param(delayedOperation)
                mapping:
                  Value:
                    metric: kafka.purgatory.size
                    type: gauge
                    desc: The number of requests waiting in purgatory
                    unit: "{request}"

              - bean: kafka.server:type=ReplicaManager,name=PartitionCount
                mapping:
                  Value:
                    metric: kafka.partition.count
                    type: gauge
                    desc: The number of partitions on the broker
                    unit: "{partition}"

              - bean: kafka.controller:type=KafkaController,name=OfflinePartitionsCount
                mapping:
                  Value:
                    metric: kafka.partition.offline
                    type: gauge
                    desc: The number of partitions offline
                    unit: "{partition}"

              - bean: kafka.server:type=ReplicaManager,name=UnderReplicatedPartitions
                mapping:
                  Value:
                    metric: kafka.partition.under_replicated
                    type: gauge
                    desc: The number of under replicated partitions
                    unit: "{partition}"

              - bean: kafka.server:type=ReplicaManager,name=IsrShrinksPerSec
                metricAttribute:
                  operation: const(shrink)
                mapping:
                  Count:
                    metric: kafka.isr.operation.count
                    type: counter
                    desc: The number of in-sync replica shrink and expand operations
                    unit: "{operation}"

              - bean: kafka.server:type=ReplicaManager,name=IsrExpandsPerSec
                metricAttribute:
                  operation: const(expand)
                mapping:
                  Count:
                    metric: kafka.isr.operation.count
                    type: counter
                    desc: The number of in-sync replica shrink and expand operations
                    unit: "{operation}"

              - bean: kafka.server:type=ReplicaFetcherManager,name=MaxLag,clientId=Replica
                mapping:
                  Value:
                    metric: kafka.max.lag
                    type: gauge
                    desc: The max lag in messages between follower and leader replicas
                    unit: "{message}"

              - bean: kafka.controller:type=KafkaController,name=ActiveControllerCount
                mapping:
                  Value:
                    metric: kafka.controller.active.count
                    type: gauge
                    desc: For KRaft mode, the number of active controllers in the cluster. For ZooKeeper, indicates whether the broker is the controller broker.
                    unit: "{controller}"

              - bean: kafka.controller:type=ControllerStats,name=LeaderElectionRateAndTimeMs
                mapping:
                  Count:
                    metric: kafka.leader.election.rate
                    type: counter
                    desc: The leader election count
                    unit: "{election}"

              - bean: kafka.controller:type=ControllerStats,name=UncleanLeaderElectionsPerSec
                mapping:
                  Count:
                    metric: kafka.unclean.election.rate
                    type: counter
                    desc: Unclean leader election count - increasing indicates broker failures
                    unit: "{election}"

              # ── Additional metrics — remove this section to reduce data ingest ───────────

              # Request latency: total count, 50th percentile, and average (99p kept above)
              - beans:
                  - kafka.network:type=RequestMetrics,name=TotalTimeMs,request=Produce
                  - kafka.network:type=RequestMetrics,name=TotalTimeMs,request=FetchConsumer
                  - kafka.network:type=RequestMetrics,name=TotalTimeMs,request=FetchFollower
                metricAttribute:
                  type: param(request)
                unit: ms
                mapping:
                  Count:
                    metric: kafka.request.time.total
                    type: counter
                    desc: The total time the broker has taken to service requests
                  50thPercentile:
                    metric: kafka.request.time.50p
                    type: gauge
                    desc: The 50th percentile time the broker has taken to service requests
                  Mean:
                    metric: kafka.request.time.avg
                    type: gauge
                    desc: The average time the broker has taken to service requests

              - bean: kafka.log:type=LogFlushStats,name=LogFlushRateAndTimeMs
                unit: ms
                type: gauge
                prefix: kafka.logs.flush.
                mapping:
                  Count:
                    metric: count
                    unit: "{flush}"
                    type: counter
                    desc: Log flush count
                  50thPercentile:
                    metric: time.50p
                    desc: Log flush time - 50th percentile
                  99thPercentile:
                    metric: time.99p
                    desc: Log flush time - 99th percentile

              # GC elapsed time (cumulative collection time in ms)
              - bean: java.lang:type=GarbageCollector,name=*
                mapping:
                  CollectionTime:
                    metric: jvm.gc.collections.elapsed
                    type: counter
                    unit: ms
                    desc: the approximate accumulated collection elapsed time in milliseconds
                    metricAttribute:
                      name: param(name)

              # JVM class loading
              - bean: java.lang:type=ClassLoading
                mapping:
                  LoadedClassCount:
                    metric: jvm.class.count
                    type: gauge
                    unit: "{class}"
                    desc: Currently loaded class count

              # JVM heap committed (in addition to heap.used and heap.max)
              - bean: java.lang:type=Memory
                unit: By
                prefix: jvm.memory.
                dropNegativeValues: true
                mapping:
                  HeapMemoryUsage.committed:
                    metric: heap.committed
                    desc: Committed heap memory
                    type: gauge

              # Additional JVM CPU and system metrics
              - bean: java.lang:type=OperatingSystem
                prefix: jvm.
                dropNegativeValues: true
                mapping:
                  SystemLoadAverage:
                    metric: system.cpu.load_1m
                    type: gauge
                    unit: "{run_queue_item}"
                    desc: System load average (1 minute) - alert if > CPU count
                  AvailableProcessors:
                    metric: cpu.count
                    type: gauge
                    unit: "{cpu}"
                    desc: Number of processors available
                  ProcessCpuLoad:
                    metric: cpu.recent_utilization
                    type: gauge
                    unit: '1'
                    desc: Recent CPU utilization for JVM process (0.0 to 1.0)
                  OpenFileDescriptorCount:
                    metric: file_descriptor.count
                    type: gauge
                    unit: "{file_descriptor}"
                    desc: Number of open file descriptors - alert if > 80% of ulimit

              # JVM memory pool breakdown (by generation: G1 Old Gen, Eden, Survivor, etc.)
              - bean: java.lang:type=MemoryPool,name=*
                type: gauge
                unit: By
                metricAttribute:
                  name: param(name)
                mapping:
                  Usage.used:
                    metric: jvm.memory.pool.used
                    desc: Memory pool usage by generation (G1 Old Gen, Eden, Survivor)
                  Usage.max:
                    metric: jvm.memory.pool.max
                    desc: Maximum memory pool size
                  CollectionUsage.used:
                    metric: jvm.memory.pool.used_after_last_gc
                    desc: Memory used after last GC (shows retained memory baseline)
    resources:
      requests:
        cpu: 60m
        memory: 950Mi
      limits:
        cpu: 1000m
        memory: 1200Mi
  cart:
    envOverrides:
      - name: VALKEY_ADDR
        value: valkey-cart.{{ .Release.Namespace }}.svc.cluster.local:6379
      - name: FLAGD_HOST
        value: flagd.{{ .Release.Namespace }}.svc.cluster.local
      - name: OPAMP_SERVER_ENDPOINT
        value: ws://opamp-server.{{ .Release.Namespace }}.svc.cluster.local:4320/v1/opamp
    resources:
      requests:
        cpu: 35m
        memory: 75Mi
      limits:
        cpu: 500m
  email:
    envOverrides:
      - name: FLAGD_HOST
        value: flagd.{{ .Release.Namespace }}.svc.cluster.local
    resources:
      requests:
        cpu: 12m
        memory: 70Mi
      limits:
        cpu: 200m
  recommendation:
    envOverrides:
      - name: FLAGD_HOST
        value: flagd.{{ .Release.Namespace }}.svc.cluster.local
      - name: PRODUCT_CATALOG_ADDR
        value: product-catalog.{{ .Release.Namespace }}.svc.cluster.local:8080
    resources:
      requests:
        cpu: 60m
        memory: 60Mi
      limits:
        cpu: 750m
  product-catalog:
    resources:
      limits:
        memory: 100Mi
        cpu: 400m
      requests:
        memory: 24Mi
        cpu: 55m
    useDefault:
      env: true
    envOverrides:
      - name: GOMEMLIMIT
        value: 80MiB
  agent:
    useDefault:
      env: true
    envOverrides:
      # Chart default. Agent/chatbot answers are replayed from
      # src/agent/fixtures/vcr_cassettes, not real LLM calls. To hit a real
      # LLM, set this to "False" and provide LLM_BASE_URL/API_KEY.
      - name: USE_VCR
        value: "True"
    resources:
      requests:
        cpu: 700m
        memory: 1250Mi
      limits:
        cpu: 1000m
        memory: 1536Mi
  astronomy-db:
    # Preload pg_stat_statements so the NR collector's postgresql receiver can
    # read db.server.top_query; must be set at server start (not via CREATE
    # EXTENSION alone). Schema grants for monitoring_user are applied in init.sql.
    command:
      - docker-entrypoint.sh
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.save=on
      - -c
      - track_activity_query_size=4096
      - -c
      - track_functions=all
    # Extra DB grants on top of the chart's init.sql, run after it (zz- prefix). The
    # postgresql-init mount is repeated because Helm replaces lists.
    # Permanent: the New Relic-only grants (otel/public schemas for monitoring_user) have no
    # upstream equivalent, so this override stays. Parts of it are temporary, see the
    # REMOVE/KEEP comments inside zz-grants.sql:
    #   - astronomy_user UPDATE (productCatalogLockContention needs it): DROP once
    #     https://github.com/open-telemetry/opentelemetry-helm-charts/pull/2450 is in a pinned chart.
    #   - other monitoring_user grants: DROP once a chart syncs a demo release with
    #     https://github.com/open-telemetry/opentelemetry-demo/pull/4019 (after 3.1.0).
    mountedConfigMaps:
      - name: postgresql-init
        mountPath: /docker-entrypoint-initdb.d/init.sql
        subPath: init.sql
        existingConfigMap: postgresql-init
      - name: postgresql-grants
        mountPath: /docker-entrypoint-initdb.d/zz-grants.sql
        subPath: zz-grants.sql
        data:
          zz-grants.sql: |
            \connect astronomy_db
            -- REMOVE once a pinned chart syncs demo PR 4019 (upstream init.sql grants these).
            GRANT USAGE ON SCHEMA accounting TO monitoring_user;
            GRANT SELECT ON accounting."order" TO monitoring_user;
            GRANT SELECT ON accounting.orderitem TO monitoring_user;
            GRANT USAGE ON SCHEMA catalog TO monitoring_user;
            GRANT SELECT ON ALL TABLES IN SCHEMA catalog TO monitoring_user;
            ALTER DEFAULT PRIVILEGES IN SCHEMA catalog GRANT SELECT ON TABLES TO monitoring_user;
            -- REMOVE once helm-charts PR 2450 is in a pinned chart.
            GRANT UPDATE ON ALL TABLES IN SCHEMA catalog TO astronomy_user;
            -- REMOVE once the pinned chart's init.sql runs these (already in upstream demo main).
            GRANT pg_monitor TO monitoring_user;
            CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
            -- KEEP: New Relic-only grants, no upstream equivalent. If these are all that
            -- remains, shrink this file to \connect + these lines.
            CREATE SCHEMA IF NOT EXISTS otel;
            GRANT USAGE ON SCHEMA otel TO monitoring_user;
            GRANT USAGE ON SCHEMA public TO monitoring_user;
            GRANT SELECT ON ALL TABLES IN SCHEMA public TO monitoring_user;
    additionalVolumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 128Mi
    additionalVolumeMounts:
      - name: dshm
        mountPath: /dev/shm
    resources:
      limits:
        memory: 384Mi
        cpu: 400m
      requests:
        memory: 90Mi
        cpu: 15m
  load-generator:
    # v3.1.0+ Locust load generator: Python-based with Playwright browser automation
    # Uses upstream defaults for LOCUST_* and FLAGD_* vars
    # NewRelic customizations:
    # - OTEL_EXPORTER_OTLP_ENDPOINT: Locust (Python) uses OTLP gRPC exporters, so this must be the gRPC port (4317), not HTTP (4318)
    envOverrides:
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://$(OTEL_COLLECTOR_NAME):4317
    resources:
      requests:
        cpu: 1000m
        memory: 700Mi
      limits:
        cpu: 4000m
        memory: 4Gi
  ad:
    resources:
      requests:
        cpu: 20m
        memory: 280Mi
      limits:
        cpu: 750m
        memory: 450Mi
  chatbot:
    resources:
      requests:
        cpu: 110m
        memory: 175Mi
      limits:
        cpu: 1000m
  currency:
    resources:
      requests:
        cpu: 10m
        memory: 15Mi
      limits:
        cpu: 200m
        memory: 40Mi
  fraud-detection:
    envOverrides:
      - name: OTEL_INSTRUMENTATION_KAFKA_PRODUCER_PROPAGATION_ENABLED
        value: "true"
      - name: OTEL_RESOURCE_ATTRIBUTES
        value: >-
          service.name=$(OTEL_SERVICE_NAME),
          service.namespace=opentelemetry-demo,
          service.version={{ .Chart.AppVersion }},
          service.instance.id=$(OTEL_POD_NAME),
          k8s.container.name=$(OTEL_K8S_CONTAINER_NAME),
          k8s.pod.name=$(OTEL_POD_NAME),
          k8s.pod.uid=$(OTEL_POD_UID),
          k8s.namespace.name=$(OTEL_NAMESPACE_NAME),
          k8s.cluster.name=$(OTEL_CLUSTER_NAME),
          service.criticality=low,
          kafka.cluster.name=$(KAFKA_CLUSTER_NAME)
    resources:
      requests:
        cpu: 30m
        memory: 300Mi
      limits:
        cpu: 1000m
        memory: 384Mi
  frontend:
    resources:
      requests:
        cpu: 75m
        memory: 170Mi
      limits:
        cpu: 1000m
  frontend-proxy:
    resources:
      requests:
        cpu: 60m
        memory: 32Mi
      limits:
        cpu: 300m
  image-provider:
    resources:
      requests:
        cpu: 10m
        memory: 10Mi
      limits:
        cpu: 200m
  mcp:
    resources:
      requests:
        cpu: 10m
        memory: 165Mi
      limits:
        cpu: 300m
  opamp-server:
    resources:
      requests:
        cpu: 10m
        memory: 10Mi
      limits:
        cpu: 100m
  payment:
    resources:
      requests:
        cpu: 18m
        memory: 85Mi
      limits:
        cpu: 200m
  quote:
    resources:
      requests:
        cpu: 10m
        memory: 28Mi
      limits:
        cpu: 200m
        memory: 64Mi
  shipping:
    resources:
      requests:
        cpu: 10m
        memory: 10Mi
      limits:
        cpu: 200m
        memory: 40Mi
  telemetry-docs:
    resources:
      requests:
        cpu: 10m
        memory: 10Mi
      limits:
        cpu: 100m
  valkey-cart:
    resources:
      requests:
        cpu: 10m
        memory: 15Mi
      limits:
        cpu: 100m
        memory: 40Mi
  flagd:
    resources:
      requests:
        cpu: 30m
        memory: 55Mi
      limits:
        cpu: 300m
opensearch:
  enabled: false
grafana:
