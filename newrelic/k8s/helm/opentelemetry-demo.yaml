default:
  # List of environment variables applied to all components
  env:
    - name: OTEL_SERVICE_NAME
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: "metadata.labels['app.kubernetes.io/component']"
    - name: OTEL_POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: OTEL_POD_UID
      valueFrom:
        fieldRef:
          fieldPath: metadata.uid
    - name: OTEL_K8S_CONTAINER_NAME
      valueFrom:
        fieldRef:
          apiVersion: v1
          fieldPath: "metadata.labels['app.kubernetes.io/component']"
    - name: OTEL_NAMESPACE_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: OTEL_CLUSTER_NAME
      value: opentelemetry-demo
    - name: OTEL_COLLECTOR_NAME
      value: nr-k8s-otel-collector-gateway
    - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
      value: delta
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: >-
        service.name=$(OTEL_SERVICE_NAME),
        service.namespace=opentelemetry-demo,
        service.version={{ .Chart.AppVersion }},
        service.instance.id=$(OTEL_POD_NAME),
        k8s.container.name=$(OTEL_K8S_CONTAINER_NAME),
        k8s.pod.name=$(OTEL_POD_NAME),
        k8s.pod.uid=$(OTEL_POD_UID),
        k8s.namespace.name=$(OTEL_NAMESPACE_NAME),
        k8s.cluster.name=$(OTEL_CLUSTER_NAME)
    - name: OTEL_METRIC_EXPORT_INTERVAL
      value: "10000"

components:
  accounting:
    resources:
      limits:
        memory: 300Mi
      requests:
        memory: 200Mi
  checkout:
    resources:
      limits:
        memory: 100Mi
      requests:
        memory: 50Mi
  product-catalog:
    resources:
      limits:
        memory: 100Mi
      requests:
        memory: 50Mi
    useDefault:
      env: true
    envOverrides:
      - name: GOMEMLIMIT
        value: 80MiB
  agent:
    useDefault:
      env: true
    envOverrides:
      # Chart default. Agent/chatbot answers are replayed from
      # src/agent/fixtures/vcr_cassettes, not real LLM calls. To hit a real
      # LLM, set this to "False" and provide LLM_BASE_URL/API_KEY.
      - name: USE_VCR
        value: "True"
  astronomy-db:
    # Preload pg_stat_statements so the NR collector's postgresql receiver can
    # read db.server.top_query; must be set at server start (not via CREATE
    # EXTENSION alone). Schema grants for monitoring_user are applied in init.sql.
    command:
      - docker-entrypoint.sh
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.save=on
      - -c
      - track_activity_query_size=4096
      - -c
      - track_functions=all
    resources:
      limits:
        memory: 200Mi
      requests:
        memory: 100Mi
  load-generator:
    # v3.1.0+ Locust load generator: Python-based with Playwright browser automation
    # Uses upstream defaults for LOCUST_* and FLAGD_* vars
    # NewRelic customizations:
    # - OTEL_EXPORTER_OTLP_ENDPOINT: gRPC endpoint for Locust (Python) traces/metrics export
    # - NEXT_PUBLIC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: empty to disable browser trace export from
    #   Playwright/frontend (avoids CORS errors and duplication with RUM agent)
    envOverrides:
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: http://$(OTEL_COLLECTOR_NAME):4318
      - name: NEXT_PUBLIC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
        value: ""
        

opensearch:
  enabled: false
grafana:
  enabled: false
prometheus:
  enabled: false
jaeger:
  enabled: false
opentelemetry-collector:
  enabled: false
