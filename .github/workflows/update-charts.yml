name: Update Charts

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * 0' # Once a week, Sunday 00:30 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-charts:
    permissions:
      contents: write  # Push chart updates to repo
      pull-requests: write  # Create pull requests for updates
      issues: write  # Create issues for failures
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update charts and create pull request
        id: update-k8s
        run: |
          ./update-k8s.sh
        working-directory: ./newrelic/scripts
        env:
          TARGET_REPO: ${{ vars.MERGE_UPSTREAM_TARGET_REPO }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create issue if update failed
        if: ${{ failure() }}
        run: |
          echo "::error:: Update charts failed"

          TS_FULL=$(date +"%Y-%m-%d %H:%M:%S")

          gh issue create --title "Failed to update charts on $TS_FULL" \
            --body "This issue was generated on $TS_FULL by the Update Charts action due to a failure during the update process. Please resolve manually." \
            --label 'update-charts-failure' \
            --repo $TARGET_REPO

          echo "::notice:: Issue created for update charts failure"
        env:
          TARGET_REPO: ${{ vars.MERGE_UPSTREAM_TARGET_REPO }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
