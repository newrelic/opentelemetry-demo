name: NewRelic Lint

on:
  pull_request:
    branches: [main]
    paths:
      - 'newrelic/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-lint:
    name: Go (newrelic/cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: newrelic/cli/go.mod
      - uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          working-directory: newrelic/cli
          version: v2.12.2

  shell-lint:
    name: Shell (newrelic/scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: run shellcheck
        run: find newrelic/scripts -name '*.sh' -print0 | xargs -0 shellcheck --severity=warning

  python-lint:
    name: Python (newrelic/scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.x'
      - name: install ruff
        run: pip install --require-hashes -r newrelic/.github/requirements/ruff.txt
      - name: run ruff
        run: ruff check --cache-dir newrelic/.ruff_cache newrelic/scripts/

  terraform-fmt:
    name: Terraform (newrelic/terraform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - name: check terraform formatting
        run: terraform fmt -check -recursive newrelic/terraform/

  yaml-lint:
    name: YAML (newrelic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.x'
      - name: install yamllint
        run: pip install --require-hashes -r newrelic/.github/requirements/yamllint.txt
      - name: run yamllint
        run: yamllint newrelic/ -c newrelic/.yamllint.yaml -f github

  k8s-chart-validation:
    name: K8s Chart Validation (newrelic/**)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: latest

      - name: Install yq and otelcol
        run: |
          sudo apt-get update
          sudo apt-get install -y yq
          # Extract collector version from values file
          COLLECTOR_VERSION=$(yq -r '.images.collector.tag' newrelic/k8s/helm/nr-k8s-otel-collector.yaml)
          echo "Using otelcol version: $COLLECTOR_VERSION"

          # Try to download and install otelcol-contrib matching the configured
          # version. Fall back to the latest release (with a warning) if that
          # exact version's asset isn't published; skip binary validation
          # entirely (also with a warning) if even that fails.
          install_otelcol() {
            wget -q "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v${1}/otelcol-contrib_${1}_linux_amd64.tar.gz" -O /tmp/otelcol.tar.gz 2>/dev/null || return 1
            tar -xzf /tmp/otelcol.tar.gz -C /tmp/ 2>/dev/null || return 1
            sudo mv /tmp/otelcol-contrib /usr/local/bin/ 2>/dev/null || return 1
            sudo chmod +x /usr/local/bin/otelcol-contrib 2>/dev/null || return 1
          }

          if install_otelcol "${COLLECTOR_VERSION}"; then
            echo "otelcol-contrib installed (version $COLLECTOR_VERSION, matches configured collector)"
          else
            LATEST_VERSION=$(curl -s https://api.github.com/repos/open-telemetry/opentelemetry-collector-releases/releases/latest | grep '"tag_name"' | sed -E 's/.*"v([^"]+)".*/\1/')
            if [ -n "$LATEST_VERSION" ] && install_otelcol "${LATEST_VERSION}"; then
              echo "::warning::otelcol-contrib v${COLLECTOR_VERSION} release asset not found; installed latest (v${LATEST_VERSION}) instead"
            else
              echo "::warning::Could not install any otelcol-contrib release; validation will skip binary checks"
            fi
          fi

      - name: Add Helm repositories
        run: |
          helm repo add newrelic https://helm-charts.newrelic.com
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo update

      - name: Run chart validation
        run: ./newrelic/scripts/validate-k8s-charts.sh
        env:
          NR_K8S_VALUES_PATH: "newrelic/k8s/helm/nr-k8s-otel-collector.yaml"
          NR_K8S_RENDERED_PATH: "newrelic/k8s/rendered/nr-k8s-otel-collector.yaml"

  js-lint:
    name: JS (newrelic/docker/config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: check JS syntax
        run: find newrelic -name '*.js' ! -name 'monkey-patch-injected.js' -print0 | xargs -0 node --check

  markdown-lint:
    name: Markdown (newrelic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: install markdownlint-cli
        run: npm install -g markdownlint-cli@0.49.0
      - name: run markdownlint
        run: markdownlint --config newrelic/.markdownlint.yaml 'newrelic/**/*.md'
